<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" font-family="sans-serif">
  <rect x="0" y="0" width="440" height="320" fill="#ffffff"/>
  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272f">囚人のジレンマ: 最善応答が「裏切り」に重なる</text>

  <!-- 表 -->
  <rect x="110" y="60" width="150" height="60" fill="#ffffff" stroke="#23272f" stroke-width="1.5"/>
  <rect x="260" y="60" width="150" height="60" fill="#ffffff" stroke="#23272f" stroke-width="1.5"/>
  <rect x="110" y="120" width="150" height="60" fill="#ffffff" stroke="#23272f" stroke-width="1.5"/>
  <rect x="260" y="120" width="150" height="60" fill="#dbe9f7" stroke="#2f5fa8" stroke-width="1.8"/>

  <text x="185" y="52" text-anchor="middle" font-size="13" fill="#2f5fa8" font-weight="bold">相手: 協力</text>
  <text x="335" y="52" text-anchor="middle" font-size="13" fill="#2f5fa8" font-weight="bold">相手: 裏切り</text>
  <text x="100" y="95" text-anchor="end" font-size="13" fill="#1f6f5c" font-weight="bold">自分: 協力</text>
  <text x="100" y="155" text-anchor="end" font-size="13" fill="#1f6f5c" font-weight="bold">自分: 裏切り</text>

  <text x="185" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#23272f">(3, 3)</text>
  <text x="185" y="104" text-anchor="middle" font-size="10" fill="#5a6270">全体で最良</text>
  <text x="335" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#23272f">(0, 5)</text>
  <text x="335" y="104" text-anchor="middle" font-size="10" fill="#5a6270">自分が最悪</text>
  <text x="185" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#23272f">(5, 0)</text>
  <text x="185" y="164" text-anchor="middle" font-size="10" fill="#5a6270">自分が最高</text>
  <text x="335" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#23272f">(1, 1)</text>
  <text x="335" y="164" text-anchor="middle" font-size="10" fill="#5a6270">均衡(どちらも裏切り)</text>

  <!-- 最善応答の注釈(表の下) -->
  <text x="220" y="212" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">自分の最善応答は、どちらの列でも「裏切り」</text>
  <text x="220" y="232" text-anchor="middle" font-size="12" fill="#5a6270">相手の選び方にかかわらず、裏切りのほうが得。</text>
  <text x="220" y="252" text-anchor="middle" font-size="12" fill="#5a6270">だから(裏切り, 裏切り)が唯一の均衡。</text>
  <text x="220" y="274" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">個人の合理 → 全体では 3+3 より 1+1(非効率)</text>
  <text x="220" y="296" text-anchor="middle" font-size="12" fill="#5a6270">繰り返しなら協力が均衡になりうる → 第 5 節</text>
</svg>
