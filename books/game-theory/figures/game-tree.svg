<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" font-family="sans-serif">
  <rect x="0" y="0" width="440" height="320" fill="#ffffff"/>
  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272f">展開形(ゲームの木)と後ろ向き帰納</text>

  <!-- 先手の分岐 -->
  <circle cx="70" cy="160" r="6" fill="#1f6f5c"/>
  <text x="60" y="140" font-size="12" fill="#1f6f5c" font-weight="bold">先手: 自店</text>
  <line x1="76" y1="156" x2="180" y2="90" stroke="#23272f" stroke-width="1.8"/>
  <line x1="76" y1="164" x2="180" y2="230" stroke="#23272f" stroke-width="1.8"/>
  <text x="112" y="104" font-size="12" fill="#23272f">安売りする</text>
  <text x="112" y="216" font-size="12" fill="#23272f">しない</text>

  <!-- 後手の分岐(上) -->
  <circle cx="190" cy="84" r="6" fill="#2f5fa8"/>
  <text x="180" y="64" font-size="12" fill="#2f5fa8" font-weight="bold">後手: 競合店</text>
  <line x1="196" y1="80" x2="300" y2="50" stroke="#23272f" stroke-width="1.5"/>
  <line x1="196" y1="88" x2="300" y2="110" stroke="#23272f" stroke-width="1.5"/>
  <text x="238" y="46" font-size="12" fill="#23272f">対抗する</text>
  <text x="238" y="118" font-size="12" fill="#23272f">しない</text>
  <!-- 葉(上) -->
  <text x="306" y="48" font-size="12" font-weight="bold" fill="#23272f">(1, 1) 潰し合い</text>
  <text x="306" y="112" font-size="12" font-weight="bold" fill="#1f6f5c">(4, 3) 自店だけ安い</text>

  <!-- 葉(下) -->
  <text x="186" y="250" font-size="12" font-weight="bold" fill="#23272f">(3, 3) 現状維持</text>

  <!-- 後ろ向き帰納の手順 -->
  <text x="220" y="288" text-anchor="middle" font-size="12" fill="#5a6270">① 最後の分岐: 対抗すると損 → 後手は「しない」を選ぶ</text>
  <text x="220" y="308" text-anchor="middle" font-size="12" fill="#5a6270">② 先手はそれを読んで「安売りする」→ 結果は (4, 3)</text>

  <!-- 対抗する枝を打ち消し(実行しない脅し) -->
  <line x1="196" y1="80" x2="296" y2="52" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="222" y="72" font-size="10" fill="#c0392b" font-weight="bold">空の脅し(実行すると損)</text>
</svg>
