<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" font-family="sans-serif">
  <rect x="0" y="0" width="440" height="300" fill="#ffffff"/>
  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272f">凝固点降下: 塩を溶かすと氷点が下がる</text>

  <!-- 左: 純水の結晶 -->
  <text x="110" y="52" text-anchor="middle" font-size="12" fill="#23272f" font-weight="bold">純水: 0 度で凍る</text>
  <rect x="40" y="66" width="140" height="120" rx="10" fill="#eef2f7" stroke="#2f5fa8" stroke-width="1.5"/>
  <!-- 氷の六角ネットワーク -->
  <g stroke="#2f5fa8" stroke-width="1.5" fill="#dbe9f7">
    <circle cx="80" cy="100" r="8"/><circle cx="120" cy="100" r="8"/><circle cx="100" cy="134" r="8"/>
    <circle cx="60" cy="134" r="8"/><circle cx="140" cy="134" r="8"/><circle cx="80" cy="168" r="8"/><circle cx="120" cy="168" r="8"/>
  </g>
  <g stroke="#5a6270" stroke-width="1.2">
    <line x1="80" y1="100" x2="120" y2="100"/><line x1="120" y1="100" x2="140" y2="134"/>
    <line x1="140" y1="134" x2="120" y2="168"/><line x1="120" y1="168" x2="80" y2="168"/>
    <line x1="80" y1="168" x2="60" y2="134"/><line x1="60" y1="134" x2="80" y2="100"/>
    <line x1="100" y1="134" x2="80" y2="100"/><line x1="100" y1="134" x2="120" y2="100"/>
    <line x1="100" y1="134" x2="120" y2="168"/><line x1="100" y1="134" x2="80" y2="168"/>
    <line x1="100" y1="134" x2="60" y2="134"/><line x1="100" y1="134" x2="140" y2="134"/>
  </g>
  <text x="110" y="206" text-anchor="middle" font-size="10" fill="#5a6270">分子が揃って六角の結晶が完成する</text>

  <!-- 右: 塩水 -->
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#23272f" font-weight="bold">塩水: 0 度でも凍らない</text>
  <rect x="260" y="66" width="140" height="120" rx="10" fill="#eef2f7" stroke="#8e6c1f" stroke-width="1.5"/>
  <g stroke="#5a6270" stroke-width="1.2">
    <line x1="295" y1="100" x2="325" y2="100"/><line x1="295" y1="150" x2="335" y2="160"/>
    <line x1="365" y1="110" x2="375" y2="150"/><line x1="300" y1="165" x2="330" y2="165"/>
  </g>
  <g fill="#2f5fa8">
    <circle cx="295" cy="100" r="8"/><circle cx="325" cy="100" r="8"/><circle cx="335" cy="150" r="8"/>
    <circle cx="375" cy="150" r="8"/><circle cx="300" cy="165" r="8"/><circle cx="330" cy="165" r="8"/>
    <circle cx="365" cy="110" r="8"/><circle cx="295" cy="140" r="8"/>
  </g>
  <!-- 塩イオン(邪魔する) -->
  <g fill="#c0392b">
    <circle cx="310" cy="122" r="6"/><circle cx="350" cy="125" r="6"/><circle cx="318" cy="145" r="6"/>
  </g>
  <text x="310" y="126" text-anchor="middle" font-size="7" fill="#ffffff">Na</text>
  <text x="350" y="129" text-anchor="middle" font-size="7" fill="#ffffff">Cl</text>
  <text x="318" y="148" text-anchor="middle" font-size="7" fill="#ffffff">Na</text>
  <text x="330" y="206" text-anchor="middle" font-size="10" fill="#5a6270">イオンが結晶の完成を邪魔する</text>

  <!-- 温度の矢印 -->
  <line x1="40" y1="234" x2="410" y2="234" stroke="#23272f" stroke-width="1.5"/>
  <polygon points="416,234 404,229 404,239" fill="#23272f"/>
  <text x="44" y="228" font-size="11" fill="#23272f">0 度</text>
  <line x1="110" y1="228" x2="110" y2="240" stroke="#2f5fa8" stroke-width="2"/>
  <text x="110" y="256" text-anchor="middle" font-size="10" fill="#2f5fa8" font-weight="bold">純水の氷点</text>
  <line x1="330" y1="228" x2="330" y2="240" stroke="#8e6c1f" stroke-width="2"/>
  <text x="330" y="256" text-anchor="middle" font-size="10" fill="#8e6c1f" font-weight="bold">塩水の氷点(もっと低い)</text>

  <!-- 下部注釈 -->
  <text x="220" y="282" text-anchor="middle" font-size="12" fill="#5a6270">氷点が下がる大きさは溶けた物の粒子数だけで決まる(種類は関係しない)。</text>
  <text x="220" y="298" text-anchor="middle" font-size="12" fill="#5a6270">融雪剤・アイスクリーム作り・不凍液はすべて同じ原理。</text>
</svg>
