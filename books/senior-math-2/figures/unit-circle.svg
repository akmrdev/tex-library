<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" font-family="sans-serif">
  <rect x="0" y="0" width="440" height="320" fill="#ffffff"/>
  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272f">単位円: 角 θ の点は (cos θ, sin θ)</text>

  <!-- 座標軸: 中心(200,160) 半径100 -->
  <line x1="60" y1="160" x2="350" y2="160" stroke="#5a6270" stroke-width="1.2"/>
  <line x1="200" y1="30" x2="200" y2="290" stroke="#5a6270" stroke-width="1.2"/>
  <circle cx="200" cy="160" r="100" fill="none" stroke="#2f5fa8" stroke-width="2"/>

  <!-- 角 θ = 60度 の点 -->
  <line x1="200" y1="160" x2="250" y2="73.4" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="250" cy="73.4" r="5" fill="#c0392b"/>
  <path d="M 230,160 A 30 30 0 0 0 215,134" fill="none" stroke="#8e6c1f" stroke-width="1.5"/>
  <text x="238" y="142" font-size="12" fill="#8e6c1f" font-weight="bold">θ</text>

  <!-- cos と sin の射影 -->
  <line x1="250" y1="73.4" x2="250" y2="160" stroke="#1f6f5c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="250" y1="73.4" x2="200" y2="73.4" stroke="#2f5fa8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="256" y="128" font-size="12" fill="#1f6f5c" font-weight="bold">sin θ = y 座標</text>
  <text x="150" y="60" font-size="12" fill="#2f5fa8" font-weight="bold">cos θ = x 座標</text>

  <!-- 象限の符号メモ -->
  <text x="330" y="128" font-size="11" fill="#5a6270">右で cos は正</text>
  <text x="330" y="146" font-size="11" fill="#5a6270">上で sin は正</text>

  <!-- 下部注釈 -->
  <text x="220" y="292" text-anchor="middle" font-size="12" fill="#5a6270">回転し続ける点の x 座標が cos、y 座標が sin。</text>
  <text x="220" y="312" text-anchor="middle" font-size="12" fill="#5a6270">1 周で元に戻る = 三角関数の周期 2π。弧の長さで角を測るのが弧度法。</text>
</svg>
