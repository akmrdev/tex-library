<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="一次関数 y=2x+1 と y=-x+4 のグラフ">
  <title>一次関数のグラフ</title>
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="236" x2="100" y2="244"/>
    <line x1="130" y1="236" x2="130" y2="244"/>
    <line x1="160" y1="236" x2="160" y2="244"/>
    <line x1="190" y1="236" x2="190" y2="244"/>
    <line x1="220" y1="236" x2="220" y2="244"/>
    <line x1="250" y1="236" x2="250" y2="244"/>
    <line x1="280" y1="236" x2="280" y2="244"/>
    <line x1="310" y1="236" x2="310" y2="244"/>
    <line x1="340" y1="236" x2="340" y2="244"/>
    <line x1="370" y1="236" x2="370" y2="244"/>
    <line x1="66" y1="210" x2="74" y2="210"/>
    <line x1="66" y1="180" x2="74" y2="180"/>
    <line x1="66" y1="150" x2="74" y2="150"/>
    <line x1="66" y1="120" x2="74" y2="120"/>
    <line x1="66" y1="90" x2="74" y2="90"/>
    <line x1="66" y1="60" x2="74" y2="60"/>
    <line x1="66" y1="30" x2="74" y2="30"/>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" stroke-linecap="square">
    <line x1="30" y1="240" x2="378" y2="240"/>
    <line x1="70" y1="268" x2="70" y2="32"/>
  </g>
  <g fill="#334155">
    <polygon points="380,240 370,236 370,244"/>
    <polygon points="70,30 66,40 74,40"/>
    <circle cx="100" cy="150" r="4"/>
  </g>
  <g stroke="#2563eb" stroke-width="2.5" fill="none">
    <line x1="70" y1="210" x2="160" y2="30"/>
  </g>
  <g stroke="#dc2626" stroke-width="2.5" fill="none">
    <line x1="70" y1="120" x2="190" y2="240"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#334155">
    <text x="386" y="245">x</text>
    <text x="58" y="24">y</text>
    <text x="56" y="258">O</text>
    <text x="82" y="256">1</text>
    <text x="60" y="215">1</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14">
    <text x="168" y="52" fill="#2563eb">y = 2x + 1</text>
    <text x="150" y="126" fill="#dc2626">y = -x + 4</text>
    <text x="106" y="144" fill="#334155" font-size="12">(1, 3)</text>
  </g>
</svg>
