<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="410" viewBox="0 0 440 410" font-family="sans-serif">
  <rect x="0" y="0" width="440" height="410" fill="#ffffff"/>
  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272f">テコ・滑車・歯車: 力と距離のトレードオフ</text>

  <!-- ===== 行 1: テコ ===== -->
  <text x="220" y="50" text-anchor="middle" font-size="12" fill="#23272f" font-weight="bold">テコ: 力 × 距離(モーメント)は保存</text>
  <line x1="100" y1="90" x2="320" y2="90" stroke="#2f5fa8" stroke-width="4"/>
  <polygon points="200,90 188,110 212,110" fill="#23272f"/>
  <!-- 荷物(支点に近い) -->
  <rect x="285" y="62" width="40" height="26" rx="5" fill="#dbe9f7" stroke="#2f5fa8" stroke-width="1.5"/>
  <text x="332" y="76" text-anchor="start" font-size="11" fill="#2f5fa8" font-weight="bold">重い荷物</text>
  <!-- 小さい力(支点から遠い) -->
  <line x1="115" y1="92" x2="115" y2="122" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="115,128 110,116 120,116" fill="#c0392b"/>
  <text x="115" y="144" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">小さい力(距離大)</text>
  <text x="295" y="108" text-anchor="middle" font-size="10" fill="#5a6270">近い(距離小)</text>

  <!-- ===== 行 2: 動滑車 ===== -->
  <text x="220" y="168" text-anchor="middle" font-size="12" fill="#23272f" font-weight="bold">動滑車: 力は半分、引き込む距離は 2 倍</text>
  <rect x="170" y="178" width="100" height="8" fill="#23272f"/>
  <circle cx="248" cy="198" r="12" fill="#eef2f7" stroke="#23272f" stroke-width="1.5"/>
  <circle cx="214" cy="228" r="12" fill="#dbe9f7" stroke="#2f5fa8" stroke-width="1.5"/>
  <!-- ロープ -->
  <line x1="248" y1="186" x2="248" y2="178" stroke="#5a6270" stroke-width="1.5"/>
  <line x1="238" y1="202" x2="222" y2="224" stroke="#5a6270" stroke-width="1.5"/>
  <line x1="206" y1="228" x2="180" y2="186" stroke="#5a6270" stroke-width="1.5"/>
  <!-- 荷物 -->
  <rect x="197" y="242" width="34" height="22" rx="5" fill="#dbe9f7" stroke="#2f5fa8" stroke-width="1.5"/>
  <!-- 引く力 -->
  <line x1="248" y1="210" x2="248" y2="248" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="248,254 243,242 253,242" fill="#c0392b"/>
  <text x="266" y="248" font-size="11" fill="#c0392b" font-weight="bold">力 1/2</text>
  <text x="180" y="252" text-anchor="end" font-size="10" fill="#5a6270">ロープ 2 本で支える</text>

  <!-- ===== 行 3: 歯車 ===== -->
  <text x="220" y="288" text-anchor="middle" font-size="12" fill="#23272f" font-weight="bold">歯車: 回転数とトルクが交換される</text>
  <circle cx="150" cy="340" r="24" fill="#dbe9f7" stroke="#2f5fa8" stroke-width="1.8"/>
  <g stroke="#2f5fa8" stroke-width="1.8">
    <line x1="150" y1="314" x2="150" y2="320"/><line x1="150" y1="360" x2="150" y2="366"/>
    <line x1="124" y1="340" x2="130" y2="340"/><line x1="170" y1="340" x2="176" y2="340"/>
    <line x1="133" y1="323" x2="137" y2="327"/><line x1="163" y1="353" x2="167" y2="357"/>
    <line x1="167" y1="323" x2="163" y2="327"/><line x1="137" y1="353" x2="133" y2="357"/>
  </g>
  <text x="150" y="344" text-anchor="middle" font-size="10" fill="#23272f">20歯</text>
  <text x="150" y="382" text-anchor="middle" font-size="10" fill="#2f5fa8">速い・トルク小</text>
  <circle cx="290" cy="340" r="40" fill="#eef7f3" stroke="#1f6f5c" stroke-width="1.8"/>
  <g stroke="#1f6f5c" stroke-width="1.8">
    <line x1="290" y1="298" x2="290" y2="304"/><line x1="290" y1="376" x2="290" y2="382"/>
    <line x1="248" y1="340" x2="254" y2="340"/><line x1="326" y1="340" x2="332" y2="340"/>
    <line x1="262" y1="312" x2="266" y2="316"/><line x1="314" y1="364" x2="318" y2="368"/>
    <line x1="318" y1="312" x2="314" y2="316"/><line x1="266" y1="364" x2="262" y2="368"/>
  </g>
  <text x="290" y="344" text-anchor="middle" font-size="10" fill="#23272f">40歯</text>
  <text x="290" y="394" text-anchor="middle" font-size="10" fill="#1f6f5c">遅い・トルク 2 倍</text>

</svg>
