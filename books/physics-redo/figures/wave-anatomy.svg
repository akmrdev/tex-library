<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" font-family="sans-serif">
  <rect x="0" y="0" width="440" height="300" fill="#ffffff"/>
  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#23272f">波の用語: 振幅・波長・山と谷</text>

  <!-- 中心線 -->
  <line x1="40" y1="150" x2="410" y2="150" stroke="#5a6270" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="416" y="154" font-size="11" fill="#5a6270">中心</text>

  <!-- 正弦波: 中心y=150 振幅60 波長160 起点40 -->
  <path d="M 40,150
           C 60,90 80,90 100,90
           C 120,90 140,210 160,210
           C 180,210 200,90 220,90
           C 240,90 260,210 280,210
           C 300,210 320,90 340,90
           C 360,90 380,210 400,210"
        fill="none" stroke="#2f5fa8" stroke-width="2.5"/>

  <!-- 山と谷のラベル -->
  <text x="100" y="78" text-anchor="middle" font-size="12" fill="#2f5fa8" font-weight="bold">山</text>
  <text x="160" y="232" text-anchor="middle" font-size="12" fill="#2f5fa8" font-weight="bold">谷</text>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#2f5fa8" font-weight="bold">山</text>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#2f5fa8" font-weight="bold">谷</text>

  <!-- 振幅: 中心から山までの縦矢印 -->
  <line x1="100" y1="150" x2="100" y2="94" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="100,90 96,100 104,100" fill="#c0392b"/>
  <polygon points="100,154 96,144 104,144" fill="#c0392b"/>
  <text x="108" y="128" font-size="13" fill="#c0392b" font-weight="bold">振幅</text>
  <text x="108" y="144" font-size="10" fill="#c0392b">大きさ(音量)</text>

  <!-- 波長: 山から次の山までの横矢印 -->
  <line x1="100" y1="60" x2="216" y2="60" stroke="#1f6f5c" stroke-width="1.5"/>
  <polygon points="220,60 210,56 210,64" fill="#1f6f5c"/>
  <polygon points="96,60 106,56 106,64" fill="#1f6f5c"/>
  <text x="158" y="52" text-anchor="middle" font-size="13" fill="#1f6f5c" font-weight="bold">波長 λ</text>

  <!-- 補足 -->
  <text x="220" y="266" text-anchor="middle" font-size="12" fill="#5a6270">振幅 = 揺れの深さ、波長 = 山と山の間隔、周期 = 1 揺れの秒数</text>
  <text x="220" y="286" text-anchor="middle" font-size="12" fill="#5a6270">速さは v = fλ(1 周期で波長 1 つ分進む)</text>
</svg>
